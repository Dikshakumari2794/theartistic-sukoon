
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | The Artistic Sukoon</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fffaf5;
            color: #393331;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 20px 8%;
            background: white;
            box-shadow: 0 2px 10px #00000010;
        }

        header a {
            color: #b76e79;
            text-decoration: none;
            font-size: 22px;
            font-weight: bold;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 35px 15px;
        }

        .signup-card {
            width: 100%;
            max-width: 440px;
            padding: 35px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 5px 25px #00000012;
        }

        h1 {
            text-align: center;
            color: #b76e79;
            margin-bottom: 10px;
        }

        .intro {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: none;
            border-radius: 25px;
            background: #b76e79;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #96515d;
        }

        .links {
            text-align: center;
            margin-top: 22px;
            line-height: 1.9;
        }

        .links a {
            color: #b76e79;
            font-weight: bold;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            line-height: 1.5;
            color: #96515d;
        }

        footer {
            background: #393331;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

<header>
    <a href="index.html">The Artistic Sukoon 🎨</a>
</header>

<main>
    <section class="signup-card">
        <h1>Create Account</h1>
        <p class="intro">Join our creative community!</p>

        <form id="signupForm">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>

            <label for="password">Create Password</label>
            <input type="password" id="password" name="password"
                   placeholder="At least 8 characters"
                   minlength="8" required>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword"
                   name="confirmPassword"
                   placeholder="Enter password again"
                   minlength="8" required>

            <button type="submit">Create Account</button>
            <p id="message" class="message" aria-live="polite"></p>
        </form>

        <p class="links">
            Already have an account?
            <a href="login.html">Login</a>
            <br>
            <a href="index.html">← Back to Home</a>
        </p>
    </section>
</main>

<footer>
    <p>© 2026 The Artistic Sukoon</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // Your Supabase project details
    const SUPABASE_URL = "https://lggdeyewxrqpzgqemrmr.supabase.co";

    // Paste your publishable key from Notepad between the quotes
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_etpSTvH7sSkyGPd1qQqbbQ_WvSlvNSr";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById("signupForm");
    const message = document.getElementById("message");
    const submitButton = form.querySelector('button[type="submit"]');

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const confirmPassword =
            document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {
            message.textContent = "Passwords do not match.";
            return;
        }

        if (SUPABASE_PUBLISHABLE_KEY ===
            "PASTE_YOUR_PUBLISHABLE_KEY_HERE") {
            message.textContent =
                "Please add your Supabase publishable key first.";
            return;
        }

        submitButton.disabled = true;
        submitButton.textContent = "Creating account...";
        message.textContent = "";

        try {
            const { data, error } =
                await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        emailRedirectTo:"https://inquisitive-moxie-787f60.netlify.app/login.html",
                        data: {
                            full_name: name
                        }
                    }
                });

            if (error) {
                throw error;
            }

            if (data.session) {
                message.textContent =
                    "Account created successfully! You can now log in.";
            } else {
                message.textContent =
                    "Account request submitted! Please check your email " +
                    "for a confirmation link before logging in.";
            }

            form.reset();

        } catch (error) {
            message.textContent =
                "Signup failed: " + error.message;
        } finally {
            submitButton.disabled = false;
            submitButton.textContent = "Create Account";
        }
    });
</script>


</body>
</html>
